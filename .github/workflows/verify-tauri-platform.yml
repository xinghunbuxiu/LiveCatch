name: Verify LiveCatch Tauri Platform

on:
  workflow_call:
    inputs:
      platform:
        required: true
        type: string
      runner:
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    name: ${{ inputs.platform }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 90
    env:
      # Change this single version when intentionally upgrading FFmpeg.
      # The fetch scripts derive the immutable release tag from this version.
      LIXH_FFMPEG_VERSION: "9.0.2"
      LIXH_FFMPEG_REPO: "xinghunbuxiu/LiveCatchFfmpeg"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: dtolnay/rust-toolchain@stable
      - run: npm install
      - name: Prepare platform FFmpeg runtime and SDK
        shell: bash
        run: |
          set -euo pipefail
          bash src-tauri/lixh-stream-stack/scripts/prepare-runtime.sh "${{ inputs.platform }}"
          bash src-tauri/lixh-stream-stack/scripts/fetch-ffmpeg-sdk.sh "${{ inputs.platform }}" "src-tauri/lixh-stream-stack/sdk/${{ inputs.platform }}"
          if [ "${{ runner.os }}" = "Windows" ]; then
            echo "LIXH_FFMPEG_DIR=${{ github.workspace }}\\src-tauri\\lixh-stream-stack\\sdk\\${{ inputs.platform }}" >> "$GITHUB_ENV"
          else
            echo "LIXH_FFMPEG_DIR=$PWD/src-tauri/lixh-stream-stack/sdk/${{ inputs.platform }}" >> "$GITHUB_ENV"
            if [ "${{ runner.os }}" = "macOS" ]; then
              echo "DYLD_LIBRARY_PATH=$PWD/src-tauri/lixh-stream-stack/sdk/${{ inputs.platform }}/lib:\${DYLD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"
            fi
          fi
          rm -rf src-tauri/resources/ffmpeg
          mkdir -p src-tauri/resources/ffmpeg
          cp -R "src-tauri/lixh-stream-stack/runtime/${{ inputs.platform }}/." src-tauri/resources/ffmpeg/
          # Fail fast if the SDK layout is incomplete (avoids opaque cargo exit 101).
          test -f "src-tauri/lixh-stream-stack/sdk/${{ inputs.platform }}/include/libavcodec/avcodec.h"
          if [[ "${{ inputs.platform }}" == macos-* ]]; then
            ls "src-tauri/lixh-stream-stack/sdk/${{ inputs.platform }}/lib"/libavutil*.dylib
          elif [[ "${{ inputs.platform }}" == windows-* ]]; then
            ls "src-tauri/lixh-stream-stack/sdk/${{ inputs.platform }}/lib"/avutil*.def \
              "src-tauri/lixh-stream-stack/sdk/${{ inputs.platform }}/lib"/libavutil.dll.a
          fi
      - name: cargo test (stream-stack)
        env:
          RUST_BACKTRACE: "1"
        shell: bash
        run: |
          set -euo pipefail
          cargo test --manifest-path src-tauri/lixh-stream-stack/Cargo.toml 2>&1 | tee "${RUNNER_TEMP}/cargo-test.log"
      - name: Build Tauri installer
        shell: bash
        env:
          RUST_BACKTRACE: "1"
        run: |
          set -euo pipefail
          case "${{ inputs.platform }}" in
            windows-*)
              npm run tauri build -- --bundles nsis 2>&1 | tee "${RUNNER_TEMP}/tauri-build.log"
              ;;
            macos-*)
              # Unsigned DMG is installable; Gatekeeper may require right-click → Open.
              npm run tauri build -- --bundles dmg 2>&1 | tee "${RUNNER_TEMP}/tauri-build.log"
              ;;
            *)
              echo "Unsupported platform for installer: ${{ inputs.platform }}" >&2
              exit 1
              ;;
          esac
      - name: Collect installer artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          shopt -s nullglob
          case "${{ inputs.platform }}" in
            windows-*)
              files=(src-tauri/target/release/bundle/nsis/*.exe)
              ;;
            macos-*)
              files=(src-tauri/target/release/bundle/dmg/*.dmg)
              ;;
          esac
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "No installer files found under src-tauri/target/release/bundle" >&2
            find src-tauri/target -maxdepth 5 -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.app' \) 2>/dev/null | head -n 50 || true
            exit 1
          fi
          cp -v "${files[@]}" artifacts/
          ls -lah artifacts
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: livecatch-tauri-${{ inputs.platform }}
          path: artifacts/*
          if-no-files-found: error
      - name: Surface build errors
        if: failure()
        shell: bash
        run: |
          set -uo pipefail
          for f in cargo-test.log tauri-build.log; do
            log="${RUNNER_TEMP}/${f}"
            [[ -f "$log" ]] || continue
            echo "===== ${f} (tail) ====="
            tail -n 160 "$log" || true
            grep -E 'error(\[E[0-9]+\])?:|error:|FAILED|panic|assert|undefined reference|ld:|clang:|fatal' "$log" \
              | head -n 40 \
              | while IFS= read -r line; do
                  echo "::error::${line}"
                done || true
          done
