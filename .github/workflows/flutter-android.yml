name: Flutter Android

on:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: livecatch-flutter-android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    name: android build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      LIXH_FFMPEG_VERSION: "9.0.2"
      LIXH_FFMPEG_REPO: "xinghunbuxiu/LiveCatchFfmpeg"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install unzip
        run: sudo apt-get update && sudo apt-get install -y unzip
      - name: Fetch FFmpeg android-arm64
        run: |
          set -euo pipefail
          chmod +x src-tauri/lixh-stream-stack/scripts/*.sh
          bash src-tauri/lixh-stream-stack/scripts/prepare-runtime.sh android-arm64
          bash src-tauri/lixh-stream-stack/scripts/fetch-ffmpeg-sdk.sh android-arm64 \
            "src-tauri/lixh-stream-stack/sdk/android-arm64"
      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses || true
      - name: Pub get
        working-directory: flutter_app
        run: flutter pub get
      - name: Build Android APK (arm64)
        working-directory: flutter_app
        run: flutter build apk --release --target-platform android-arm64
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: livecatch-android-arm64
          path: flutter_app/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
