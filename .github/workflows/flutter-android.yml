name: Flutter Android

on:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: livecatch-flutter-android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    name: android build
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      LIXH_FFMPEG_VERSION: "9.0.2"
      LIXH_FFMPEG_REPO: "xinghunbuxiu/LiveCatchFfmpeg"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install unzip
        run: sudo apt-get update && sudo apt-get install -y unzip
      - name: Fetch FFmpeg android-arm64 + android-armv7
        run: |
          set -euo pipefail
          chmod +x src-tauri/lixh-stream-stack/scripts/*.sh
          for plat in android-arm64 android-armv7; do
            bash src-tauri/lixh-stream-stack/scripts/prepare-runtime.sh "$plat"
            bash src-tauri/lixh-stream-stack/scripts/fetch-ffmpeg-sdk.sh "$plat" \
              "src-tauri/lixh-stream-stack/sdk/$plat"
          done
      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses || true
      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Pub get
        working-directory: flutter_app
        run: flutter pub get
      - name: Build Android APKs (arm64 + armv7)
        working-directory: flutter_app
        run: flutter build apk --release --split-per-abi --target-platform android-arm64,android-arm
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: livecatch-android-arm
          path: flutter_app/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
