name: Verify Stream Stack

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src-tauri/lixh-stream-stack/**"
      - ".github/workflows/verify-stream-stack.yml"
      - ".github/workflows/verify-stream-stack-platform.yml"
  pull_request:
    paths:
      - "src-tauri/lixh-stream-stack/**"
      - ".github/workflows/verify-stream-stack.yml"
      - ".github/workflows/verify-stream-stack-platform.yml"

concurrency:
  group: livecatch-stream-stack-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - platform: windows-x64
            runner: windows-latest
          - platform: macos-arm64
            runner: macos-15
          - platform: macos-x64
            runner: macos-15-intel
    uses: ./.github/workflows/verify-stream-stack-platform.yml
    with:
      platform: ${{ matrix.platform }}
      runner: ${{ matrix.runner }}
