name: Verify Stream Stack All

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src-tauri/lixh-stream-stack/**"
      - ".github/workflows/verify-stream-stack.yml"
      - ".github/workflows/verify-stream-stack-platform.yml"
      - ".github/workflows/stream-stack-*.yml"
  pull_request:
    paths:
      - "src-tauri/lixh-stream-stack/**"
      - ".github/workflows/verify-stream-stack.yml"
      - ".github/workflows/verify-stream-stack-platform.yml"
      - ".github/workflows/stream-stack-*.yml"

concurrency:
  group: livecatch-stream-stack-all-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows:
    uses: ./.github/workflows/stream-stack-windows.yml
  macos-arm64:
    uses: ./.github/workflows/stream-stack-macos-arm64.yml
  macos-x64:
    uses: ./.github/workflows/stream-stack-macos-x64.yml
