# Reusable job only (not listed for manual runs). Called by Verify Stream Stack.
name: _stream-stack-platform

on:
  workflow_call:
    inputs:
      platform:
        required: true
        type: string
      runner:
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    name: ${{ inputs.platform }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 40
    env:
      LIXH_FFMPEG_VERSION: "9.0.2"
      LIXH_FFMPEG_REPO: "xinghunbuxiu/LiveCatchFfmpeg"
    steps:
      - uses: actions/checkout@v4
      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Prepare FFmpeg SDK
        shell: bash
        run: |
          set -euo pipefail
          bash src-tauri/lixh-stream-stack/scripts/prepare-runtime.sh "${{ inputs.platform }}"
          bash src-tauri/lixh-stream-stack/scripts/fetch-ffmpeg-sdk.sh "${{ inputs.platform }}" \
            "src-tauri/lixh-stream-stack/sdk/${{ inputs.platform }}"
          if [ "${{ runner.os }}" = "Windows" ]; then
            echo "LIXH_FFMPEG_DIR=${{ github.workspace }}\\src-tauri\\lixh-stream-stack\\sdk\\${{ inputs.platform }}" >> "$GITHUB_ENV"
          else
            echo "LIXH_FFMPEG_DIR=$PWD/src-tauri/lixh-stream-stack/sdk/${{ inputs.platform }}" >> "$GITHUB_ENV"
            if [ "${{ runner.os }}" = "macOS" ]; then
              echo "DYLD_LIBRARY_PATH=$PWD/src-tauri/lixh-stream-stack/sdk/${{ inputs.platform }}/lib:\${DYLD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"
            fi
          fi
          test -f "src-tauri/lixh-stream-stack/sdk/${{ inputs.platform }}/include/libavcodec/avcodec.h"
          if [[ "${{ inputs.platform }}" == macos-* ]]; then
            ls "src-tauri/lixh-stream-stack/sdk/${{ inputs.platform }}/lib"/libavutil*.dylib
          elif [[ "${{ inputs.platform }}" == windows-* ]]; then
            ls "src-tauri/lixh-stream-stack/sdk/${{ inputs.platform }}/lib"/avutil*.def \
              "src-tauri/lixh-stream-stack/sdk/${{ inputs.platform }}/lib"/libavutil.dll.a
          fi
      - name: cargo check
        env:
          RUST_BACKTRACE: "1"
        shell: bash
        run: |
          set -euo pipefail
          cargo check --manifest-path src-tauri/lixh-stream-stack/Cargo.toml 2>&1 | tee "${RUNNER_TEMP}/cargo-stack.log"
      - name: cargo test
        shell: bash
        run: |
          set -euo pipefail
          cargo test --manifest-path src-tauri/lixh-stream-stack/Cargo.toml 2>&1 | tee "${RUNNER_TEMP}/cargo-test.log"
      - name: Surface cargo errors
        if: failure()
        shell: bash
        run: |
          set -uo pipefail
          for f in cargo-stack.log cargo-test.log; do
            log="${RUNNER_TEMP}/${f}"
            [[ -f "$log" ]] || continue
            echo "===== ${f} (tail) ====="
            tail -n 120 "$log" || true
            grep -E 'error(\[E[0-9]+\])?:|error:|FAILED|panic|assert|undefined reference|ld:|clang:|fatal' "$log" \
              | head -n 40 \
              | while IFS= read -r line; do
                  echo "::error::${line}"
                done || true
          done
