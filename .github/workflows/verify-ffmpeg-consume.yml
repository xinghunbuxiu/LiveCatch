name: Verify FFmpeg Consume

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src-tauri/lixh-stream-stack/scripts/**"
      - ".github/workflows/verify-ffmpeg-consume.yml"

concurrency:
  group: livecatch-ffmpeg-consume-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  LIXH_FFMPEG_VERSION: "9.0.2"
  LIXH_FFMPEG_REPO: "xinghunbuxiu/LiveCatchFfmpeg"

jobs:
  consume:
    name: ${{ matrix.platform }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            optional: "0"
          - platform: macos-arm64
            optional: "0"
          - platform: macos-x64
            optional: "0"
          - platform: android-arm64
            optional: "0"
          - platform: ios-arm64
            optional: "0"
    steps:
      - uses: actions/checkout@v4
      - name: Install unzip
        run: sudo apt-get update && sudo apt-get install -y unzip
      - name: Fetch and verify ${{ matrix.platform }}
        shell: bash
        run: |
          set -euo pipefail
          chmod +x src-tauri/lixh-stream-stack/scripts/*.sh
          if [ "${{ matrix.optional }}" = "1" ]; then
            bash src-tauri/lixh-stream-stack/scripts/verify-ffmpeg-consume.sh "${{ matrix.platform }}" --optional
          else
            bash src-tauri/lixh-stream-stack/scripts/verify-ffmpeg-consume.sh "${{ matrix.platform }}"
          fi
