name: Verify Flutter All

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "flutter_app/**"
      - "packages/lixh_player/**"
      - "src-tauri/lixh-stream-stack/lixh-player-core/**"
      - "src-tauri/lixh-stream-stack/scripts/**"
      - ".github/workflows/verify-flutter.yml"
      - ".github/workflows/flutter-*.yml"
  pull_request:
    paths:
      - "flutter_app/**"
      - "packages/lixh_player/**"
      - "src-tauri/lixh-stream-stack/lixh-player-core/**"
      - "src-tauri/lixh-stream-stack/scripts/**"
      - ".github/workflows/verify-flutter.yml"
      - ".github/workflows/flutter-*.yml"

concurrency:
  group: livecatch-flutter-all-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    uses: ./.github/workflows/flutter-analyze.yml
  windows:
    uses: ./.github/workflows/flutter-windows.yml
  android:
    uses: ./.github/workflows/flutter-android.yml
  macos:
    uses: ./.github/workflows/flutter-macos.yml
  ios:
    uses: ./.github/workflows/flutter-ios.yml
