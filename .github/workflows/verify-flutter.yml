name: Verify Flutter

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "flutter_app/**"
      - "packages/lixh_player/**"
      - "src-tauri/lixh-stream-stack/lixh-player-core/**"
      - "src-tauri/lixh-stream-stack/scripts/**"
      - ".github/workflows/verify-flutter.yml"
  pull_request:
    paths:
      - "flutter_app/**"
      - "packages/lixh_player/**"
      - "src-tauri/lixh-stream-stack/lixh-player-core/**"
      - "src-tauri/lixh-stream-stack/scripts/**"
      - ".github/workflows/verify-flutter.yml"

concurrency:
  group: livecatch-flutter-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: analyze
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Pub get (plugin)
        working-directory: packages/lixh_player
        run: flutter pub get
      - name: Analyze plugin
        working-directory: packages/lixh_player
        run: flutter analyze --no-fatal-infos
      - name: Pub get (app)
        working-directory: flutter_app
        run: flutter pub get
      - name: Analyze app
        working-directory: flutter_app
        run: flutter analyze --no-fatal-infos
      - name: Unit tests (ABR)
        working-directory: flutter_app
        run: flutter test test/abr_supervisor_test.dart

  windows:
    name: windows build
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Fetch FFmpeg windows-x64
        shell: bash
        run: |
          set -euo pipefail
          chmod +x src-tauri/lixh-stream-stack/scripts/*.sh
          bash src-tauri/lixh-stream-stack/scripts/prepare-runtime.sh windows-x64
          bash src-tauri/lixh-stream-stack/scripts/fetch-ffmpeg-sdk.sh windows-x64 \
            "src-tauri/lixh-stream-stack/sdk/windows-x64"
      - name: Build lixh_resolve
        shell: bash
        run: |
          set -euo pipefail
          cargo build -p lixh-stream-resolver --bin lixh_resolve --release \
            --manifest-path src-tauri/lixh-stream-stack/Cargo.toml
      - name: Pub get
        working-directory: flutter_app
        run: flutter pub get
      - name: Build Windows release
        working-directory: flutter_app
        run: flutter build windows --release
      - name: Package Windows release zip
        shell: pwsh
        run: |
          $src = "flutter_app/build/windows/x64/runner/Release"
          if (-not (Test-Path $src)) { throw "Windows release output missing: $src" }
          $out = "livecatch-flutter-windows-x64.zip"
          if (Test-Path $out) { Remove-Item $out -Force }
          Compress-Archive -Path (Join-Path $src '*') -DestinationPath $out -Force
          Get-Item $out | Format-List FullName, Length
      - name: Upload Windows zip
        uses: actions/upload-artifact@v4
        with:
          name: livecatch-flutter-windows-x64
          path: livecatch-flutter-windows-x64.zip
          if-no-files-found: error

  android:
    name: android build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install unzip
        run: sudo apt-get update && sudo apt-get install -y unzip
      - name: Fetch FFmpeg android-arm64
        run: |
          set -euo pipefail
          chmod +x src-tauri/lixh-stream-stack/scripts/*.sh
          bash src-tauri/lixh-stream-stack/scripts/prepare-runtime.sh android-arm64
          bash src-tauri/lixh-stream-stack/scripts/fetch-ffmpeg-sdk.sh android-arm64 \
            "src-tauri/lixh-stream-stack/sdk/android-arm64"
      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses || true
      - name: Pub get
        working-directory: flutter_app
        run: flutter pub get
      - name: Build Android APK (arm64)
        working-directory: flutter_app
        run: flutter build apk --release --target-platform android-arm64
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: livecatch-android-arm64
          path: flutter_app/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

  macos:
    name: macos build
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      # macOS plugin uses Package.swift (SPM) with monorepo FFmpeg paths; no Podfile.
      - name: Fetch FFmpeg macos-arm64
        run: |
          set -euo pipefail
          chmod +x src-tauri/lixh-stream-stack/scripts/*.sh
          bash src-tauri/lixh-stream-stack/scripts/prepare-runtime.sh macos-arm64
          bash src-tauri/lixh-stream-stack/scripts/fetch-ffmpeg-sdk.sh macos-arm64 \
            "src-tauri/lixh-stream-stack/sdk/macos-arm64"
          # Normalize install names so the .app can load bundled/runtime dylibs.
          bash src-tauri/lixh-stream-stack/scripts/normalize-ffmpeg-macos.sh \
            "src-tauri/lixh-stream-stack/sdk/macos-arm64"
      - name: Pub get
        working-directory: flutter_app
        run: flutter pub get
      - name: Build macOS release
        working-directory: flutter_app
        run: |
          set -euo pipefail
          flutter build macos --release 2>&1 | tee "${RUNNER_TEMP}/macos-build.log"
      - name: Package macOS .app zip
        run: |
          set -euo pipefail
          APP="$(find flutter_app/build/macos -type d -name '*.app' -path '*/Build/Products/Release/*' | head -n 1)"
          if [[ -z "${APP}" ]]; then
            echo "macOS .app not found" >&2
            find flutter_app/build/macos -maxdepth 6 -type d -name '*.app' 2>/dev/null | head -n 20 || true
            exit 1
          fi
          ditto -c -k --keepParent "${APP}" livecatch-flutter-macos-arm64.zip
          ls -lah livecatch-flutter-macos-arm64.zip
      - name: Upload macOS zip
        uses: actions/upload-artifact@v4
        with:
          name: livecatch-flutter-macos-arm64
          path: livecatch-flutter-macos-arm64.zip
          if-no-files-found: error
      - name: Surface macOS errors
        if: failure()
        run: |
          set -uo pipefail
          LOG="${RUNNER_TEMP}/macos-build.log"
          if [[ -f "$LOG" ]]; then
            tail -n 200 "$LOG"
            grep -E 'error:|Error \(|&error|fatal error|Undefined symbols|ld: |CocoaPods|INVALID|FAILED' "$LOG" \
              | head -n 40 \
              | while IFS= read -r line; do
                  echo "::error::${line}"
                done || true
          fi

  ios:
    name: ios build
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      # Monorepo FFmpeg paths + static .a link more reliably via CocoaPods than SPM unsafeFlags.
      - name: Prefer CocoaPods over SPM
        run: flutter config --no-enable-swift-package-manager
      - name: Fetch and sync FFmpeg ios-arm64 into pod
        run: |
          set -euo pipefail
          chmod +x src-tauri/lixh-stream-stack/scripts/*.sh
          chmod +x packages/lixh_player/ios/sync_ffmpeg_ios.sh
          bash src-tauri/lixh-stream-stack/scripts/prepare-runtime.sh ios-arm64
          bash src-tauri/lixh-stream-stack/scripts/fetch-ffmpeg-sdk.sh ios-arm64 \
            "src-tauri/lixh-stream-stack/sdk/ios-arm64"
          bash packages/lixh_player/ios/sync_ffmpeg_ios.sh
      - name: Pub get
        working-directory: flutter_app
        run: flutter pub get
      - name: pod install
        working-directory: flutter_app/ios
        run: |
          set -euo pipefail
          pod install --repo-update
      - name: Build iOS (no codesign)
        working-directory: flutter_app
        run: |
          set -euo pipefail
          flutter build ios --release --no-codesign 2>&1 | tee "${RUNNER_TEMP}/ios-build.log"
      - name: Surface iOS errors
        if: failure()
        run: |
          set -uo pipefail
          LOG="${RUNNER_TEMP}/ios-build.log"
          if [[ -f "$LOG" ]]; then
            tail -n 200 "$LOG"
            # Emit annotations visible without downloading full logs
            grep -E 'error:|Error \(|&error|fatal error|Undefined symbols|ld: |CocoaPods|INVALID|❌|FAILED' "$LOG" \
              | head -n 40 \
              | while IFS= read -r line; do
                  echo "::error::${line}"
                done || true
          fi
