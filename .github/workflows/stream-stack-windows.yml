name: Stream Stack Windows

on:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: livecatch-stream-windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/verify-stream-stack-platform.yml
    with:
      platform: windows-x64
      runner: windows-latest
