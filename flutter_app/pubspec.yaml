name: livecatch_app
description: LiveCatch Flutter desktop shell (native decode + GPU Texture).
publish_to: "none"
version: 0.48.0+1

environment:
  # CI uses Flutter stable; local FVM 3.29 (Dart 3.7) also works.
  sdk: ">=3.7.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.5.0
  path: ^1.9.1
  lixh_player:
    path: ../packages/lixh_player
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
