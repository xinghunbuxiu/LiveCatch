[package]
name = "lixh-stream-resolver"
version = "0.9.0"
edition = "2021"
license = "MIT"
description = "Stream URL resolver for LiveCatch"

[lib]
name = "lixh_stream_resolver"
crate-type = ["rlib", "cdylib"]
path = "src/lib.rs"

[[bin]]
name = "lixh_resolve"
path = "src/bin/lixh_resolve.rs"

[dependencies]
anyhow = "1"
platforms-parser = { git = "https://github.com/hua0512/rust-srec", package = "platforms-parser" }
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "rustls-tls-webpki-roots",
  "gzip",
  "deflate",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
url = "2"

# Android: prefer in-process JNI (cdylib) so networking uses the app UID.
# Forked Process + webpki TLS is kept as a fallback binary (lixh_resolve).
[target.'cfg(target_os = "android")'.dependencies]
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "aws-lc-rs"] }
webpki-roots = "1"
jni = "0.21"
